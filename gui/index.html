<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Codex Cockpit (Minimal)</title>
  <style>
    body {
      font-family: monospace;
      background: #0b0e14;
      color: #e6e6eb;
      margin: 0;
      padding: 16px;
    }
    h1 {
      margin-top: 0;
    }
    button {
      background: #1f2430;
      color: #e6e6eb;
      border: 1px solid #3b4252;
      padding: 6px 10px;
      cursor: pointer;
    }
    #events {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid #3b4252;
      height: 60vh;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .event {
      margin-bottom: 8px;
    }
    .type {
      color: #7aa2f7;
    }
  </style>
</head>
<body>

<h1>Codex Cockpit</h1>

<button id="create">Create Session</button>
<button id="run" disabled>Run Session</button>

<div id="events"></div>

<script>
  const API = "http://localhost:8787";
  let sessionId = null;
  let source = null;

  const eventsDiv = document.getElementById("events");

  function logEvent(evt) {
    const div = document.createElement("div");
    div.className = "event";
    div.innerHTML = `<span class="type">[${evt.type}]</span> ${evt.content}`;
    eventsDiv.appendChild(div);
    eventsDiv.scrollTop = eventsDiv.scrollHeight;
  }

  document.getElementById("create").onclick = async () => {
    eventsDiv.innerHTML = "";
    const res = await fetch(`${API}/sessions/`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        goal: "Run from GUI",
        model: "local-qwen", 
        workspace: "."
      })
    });
    const data = await res.json();
    sessionId = data.session_id;
    logEvent({ type: "system", content: `Session created: ${sessionId}` });
    document.getElementById("run").disabled = false;
  };


document.getElementById("run").onclick = async () => {
  if (!sessionId) return;

  // Trigger execution (POST)
  await fetch(`${API}/sessions/${sessionId}/run`, {
    method: "POST"
  });

  // Stream events (GET via SSE)
  source = new EventSource(
    `${API}/sessions/${sessionId}/events`
  );

  source.onmessage = (e) => {
    const evt = JSON.parse(e.data);
    logEvent(evt);

    if (evt.type === "final" || evt.type === "error") {
      source.close();
    }
  };

  source.onerror = () => {
    logEvent({ type: "error", content: "SSE connection failed" });
    source.close();
  };
};

</script>

</body>
</html>
